<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heute – Hofbereich Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px">
    <div style="width: 34px; height: 34px; flex: none; border-radius: 999px; background: #24352a; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">B</div>
    <div style="min-width: 0">
      <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #8b9a8b">Mein Hof</div>
      <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Beispielhof</div>
    </div>
    <div style="flex-grow: 1"></div>
    <button aria-label="Benachrichtigungen, 1 neu" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #f1eee3; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M10.5 20a1.7 1.7 0 0 0 3 0"></path></svg>
      <span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 999px; background: #e07a4a; border: 2px solid #0b100c"></span>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 6px 16px 0; min-height: 0">

    <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 999px; border: 1px solid #2f5a3d; background: #14211a; font-size: 13px; font-weight: 600; color: #9fd0af">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Abholung heute, 15–18 Uhr
      <span style="margin-left: auto; color: #c9d2c6; font-weight: 500">8 Bestellungen</span>
    </div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #131b14; border: 1px solid #223125; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 12px; color: #9aa899">Bestellungen heute</div>
        <div style="margin-top: 4px; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">8</div>
      </div>
      <div style="background: #131b14; border: 1px solid #223125; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 12px; color: #9aa899">Noch zu packen</div>
        <div style="margin-top: 4px; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #e59a6f">5</div>
      </div>
      <div style="background: #131b14; border: 1px solid #223125; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 12px; color: #9aa899">Umsatz heute</div>
        <div style="margin-top: 4px; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">€ 186,40</div>
      </div>
      <div style="background: #131b14; border: 1px solid #223125; border-radius: 14px; padding: 12px 14px">
        <div style="font-size: 12px; color: #9aa899">Neue Kunden</div>
        <div style="margin-top: 4px; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">2</div>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #1f2c21">
        <div style="font-size: 15px; font-weight: 600">Packliste</div>
        <div style="font-size: 12.5px; color: #9aa899">5 offen</div>
        <div style="flex-grow: 1"></div>
        <button aria-label="Packliste drucken" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #f1eee3; cursor: pointer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        </button>
      </div>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: none; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Als gepackt markieren" style="width: 26px; height: 26px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d"></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600">Anna Leitner</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">10 Eier · 1 Bauernbrot</span>
        </span>
        <span style="flex: none; font-size: 13.5px; font-weight: 600">€ 10,30</span>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Als gepackt markieren" style="width: 26px; height: 26px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d"></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600">Familie Wimmer</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gemüsekiste groß · 6 Eier</span>
        </span>
        <span style="flex: none; font-size: 13.5px; font-weight: 600">€ 21,60</span>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Gepackt" style="width: 26px; height: 26px; flex: none; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600; color: #a9b4a8">Josef Huber</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #7c8a7b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 Bauernbrot</span>
        </span>
        <span style="flex: none; font-size: 13.5px; font-weight: 600; color: #a9b4a8">€ 11,60</span>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Gepackt" style="width: 26px; height: 26px; flex: none; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600; color: #a9b4a8">Maria Schuster</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #7c8a7b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gemüsekiste klein · Honig 500 g</span>
        </span>
        <span style="flex: none; font-size: 13.5px; font-weight: 600; color: #a9b4a8">€ 21,90</span>
      </button>
      <div style="padding: 11px 14px; border-top: 1px solid #1f2c21">
        <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">Alle Bestellungen →</a>
      </div>
    </div>

    <button style="flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #131b14; border: 1px solid #223125; border-radius: 16px; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
      <span style="flex: 1; min-width: 0">
        <span style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 13.5px; font-weight: 600">Deine Hofseite</span>
          <span style="font-size: 12.5px; font-weight: 600; color: #9fd0af">64 %</span>
        </span>
        <span style="display: block; margin-top: 7px; height: 6px; border-radius: 999px; background: #1c281e; overflow: hidden">
          <span style="display: block; width: 64%; height: 6px; border-radius: 999px; background: #2e6b45"></span>
        </span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Heute" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Heute</span>
    </button>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 10.5px">Bestellungen</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Neu erstellen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #e07a4a; color: #231208; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button aria-label="Mein Hof" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10Z"></path><path d="M9 21v-8h6v8"></path></svg>
      <span style="font-size: 10.5px">Mein Hof</span>
    </button>
    <button aria-label="Mehr" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px">Mehr</span>
    </button>
  </div>

</div>
</body>
</html>
