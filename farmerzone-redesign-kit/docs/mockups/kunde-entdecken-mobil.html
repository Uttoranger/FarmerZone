<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entdecken – Kundenansicht Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px">
    <div style="width: 28px; height: 28px; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"></path><path d="M2 21c0-3 1.9-5.5 5.5-6"></path></svg>
    </div>
    <div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">FarmerZone</div>
    <div style="flex-grow: 1"></div>
    <button style="display: flex; align-items: center; gap: 5px; padding: 7px 12px; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #c9d2c6; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      5280 Braunau
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0; min-height: 0">

    <div style="flex: none; position: relative">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b9a8b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 14px"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input aria-label="Hof oder Produkt suchen" placeholder="Hof oder Produkt suchen …" style="width: 100%; height: 46px; box-sizing: border-box; border-radius: 999px; background: #131b14; border: 1px solid #26352a; color: #f1eee3; font-family: inherit; font-size: 14px; padding: 0 16px 0 40px; outline: none">
    </div>

    <div style="flex: none; height: 150px; border-radius: 16px; background: #16211a; border: 1px solid #223125; position: relative; overflow: hidden">
      <svg width="358" height="150" viewBox="0 0 358 150" fill="none" style="position: absolute; inset: 0">
        <path d="M-10 112 C 60 92, 120 128, 180 96 S 290 44, 370 58" stroke="#33473a" stroke-width="9" stroke-linecap="round"></path>
        <path d="M60 -10 C 74 42, 58 96, 78 160" stroke="#33473a" stroke-width="5" stroke-linecap="round"></path>
        <path d="M250 -10 C 236 50, 262 100, 244 160" stroke="#2b3d31" stroke-width="5" stroke-linecap="round"></path>
      </svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#2e6b45" stroke="#f6f4ea" stroke-width="1.4" style="position: absolute; left: 96px; top: 34px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3" fill="#f6f4ea" stroke="none"></circle></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#2e6b45" stroke="#f6f4ea" stroke-width="1.4" style="position: absolute; left: 214px; top: 66px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3" fill="#f6f4ea" stroke="none"></circle></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#2e6b45" stroke="#f6f4ea" stroke-width="1.4" style="position: absolute; left: 288px; top: 26px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3" fill="#f6f4ea" stroke="none"></circle></svg>
      <button style="position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 7px 13px; border: none; border-radius: 999px; background: rgba(11, 16, 12, 0.75); color: #f1eee3; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">
      Karte öffnen
      </button>
    </div>

    <div style="flex: none; display: flex; align-items: baseline; gap: 8px; padding: 2px 2px 0">
      <div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">Höfe in deiner Nähe</div>
      <div style="flex-grow: 1"></div>
      <a href="#" style="font-size: 12.5px; font-weight: 600; text-decoration: none">Alle →</a>
    </div>

    <button style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden; padding: 0; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
      <span style="display: block; height: 64px; background: linear-gradient(150deg, #2c5a3a, #16301f)"></span>
      <span style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
        <span style="width: 40px; height: 40px; flex: none; margin-top: -30px; border-radius: 999px; background: linear-gradient(150deg, #35684a, #16301f); border: 2px solid #131b14; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 600">HM</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">Hof Müller</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899">2,1 km · Abholung heute, 15–18 Uhr</span>
        </span>
        <span style="flex: none; display: flex; gap: 5px">
          <span style="padding: 3px 9px; border-radius: 999px; background: #1c281e; font-size: 11px; color: #c9d2c6">Eier</span>
          <span style="padding: 3px 9px; border-radius: 999px; background: #1c281e; font-size: 11px; color: #c9d2c6">Gemüse</span>
        </span>
      </span>
    </button>

    <button style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden; padding: 0; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
      <span style="display: block; height: 64px; background: linear-gradient(150deg, #4d4126, #201a10)"></span>
      <span style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
        <span style="width: 40px; height: 40px; flex: none; margin-top: -30px; border-radius: 999px; background: #24352a; border: 2px solid #131b14; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 600">B</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">Beispielhof</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899">4,8 km · Abholung Sa, 9–12 Uhr</span>
        </span>
        <span style="flex: none; display: flex; gap: 5px">
          <span style="padding: 3px 9px; border-radius: 999px; background: #1c281e; font-size: 11px; color: #c9d2c6">Brot</span>
          <span style="padding: 3px 9px; border-radius: 999px; background: #1c281e; font-size: 11px; color: #c9d2c6">Honig</span>
        </span>
      </span>
    </button>

    <button style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px 16px 0 0; border-bottom: none; overflow: hidden; padding: 0; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
      <span style="display: block; height: 50px; background: linear-gradient(150deg, #35684a, #16301f)"></span>
    </button>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Entdecken" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8l-2.5 5.5L8 16l2.5-5.5L16 8Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Entdecken</span>
    </button>
    <button aria-label="Suche" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <span style="font-size: 10.5px">Suche</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Warenkorb öffnen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #2e6b45; color: #f6f4ea; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"></circle><circle cx="17" cy="20" r="1.6"></circle><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
      </button>
    </div>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.3-1.5L14.4 21l-2.4-1.5L9.6 21l-2.3-1.5L5 21V3Z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <span style="font-size: 10.5px">Bestellungen</span>
    </button>
    <button aria-label="Profil" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
      <span style="font-size: 10.5px">Profil</span>
    </button>
  </div>

</div>
</body>
</html>
