<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warenkorb &amp; Checkout – Mobil (Kunde)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px">
    <button aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #f1eee3; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600">Warenkorb</div>
    <div style="flex-grow: 1"></div>
    <div style="padding-right: 10px; font-size: 12.5px; color: #9aa899">Hof Müller</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0; min-height: 0">

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
        <div style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: linear-gradient(150deg, #2a5236, #142418)"></div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px; font-weight: 600">Freilandeier, 10 Stück</div>
          <div style="margin-top: 2px; font-size: 13px; color: #9aa899">€ 4,50</div>
        </div>
        <div style="flex: none; display: flex; align-items: center; gap: 9px; border: 1px solid #2f3f31; border-radius: 999px; padding: 4px 7px">
          <button aria-label="Weniger" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: #1c281e; color: #f1eee3; cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </button>
          <span style="font-size: 13.5px; font-weight: 600; min-width: 10px; text-align: center">1</span>
          <button aria-label="Mehr" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: #1c281e; color: #f1eee3; cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #1f2c21">
        <div style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: linear-gradient(150deg, #4d4126, #201a10)"></div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px; font-weight: 600">Bauernbrot, 1 kg</div>
          <div style="margin-top: 2px; font-size: 13px; color: #9aa899">€ 5,80</div>
        </div>
        <div style="flex: none; display: flex; align-items: center; gap: 9px; border: 1px solid #2f3f31; border-radius: 999px; padding: 4px 7px">
          <button aria-label="Weniger" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: #1c281e; color: #f1eee3; cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </button>
          <span style="font-size: 13.5px; font-weight: 600; min-width: 10px; text-align: center">1</span>
          <button aria-label="Mehr" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: #1c281e; color: #f1eee3; cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; border-top: 1px solid #1f2c21">
        <div style="font-size: 13.5px; color: #9aa899">Zwischensumme · keine Gebühren</div>
        <div style="flex-grow: 1"></div>
        <div style="font-size: 15px; font-weight: 600">€ 10,30</div>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <div style="font-size: 15px; font-weight: 600">Abholung wählen</div>
        <div style="font-size: 12px; color: #9aa899">Hofgasse 12, Braunau</div>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; border: 1.5px solid #2e6b45; background: #18241a; border-radius: 12px; padding: 11px 6px; text-align: center; color: #f1eee3; font-family: inherit; cursor: pointer">
          <span style="display: block; font-size: 13px; font-weight: 600">Heute</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #c9d2c6">15–18 Uhr</span>
        </button>
        <button style="flex: 1; border: 1px solid #2c3a2e; background: none; border-radius: 12px; padding: 11px 6px; text-align: center; color: #f1eee3; font-family: inherit; cursor: pointer">
          <span style="display: block; font-size: 13px; font-weight: 600">Sa, 3. Okt</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #c9d2c6">9–12 Uhr</span>
        </button>
        <button style="flex: 1; border: 1px solid #2c3a2e; background: none; border-radius: 12px; padding: 11px 6px; text-align: center; color: #f1eee3; font-family: inherit; cursor: pointer">
          <span style="display: block; font-size: 13px; font-weight: 600">Mi, 7. Okt</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #c9d2c6">15–18 Uhr</span>
        </button>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <div style="padding: 12px 14px 4px; font-size: 15px; font-weight: 600">Bezahlen</div>
      <button style="width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: none; border: none; color: #f1eee3; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <span style="width: 20px; height: 20px; flex: none; border-radius: 999px; border: 2px solid #2e6b45; display: flex; align-items: center; justify-content: center">
          <span style="width: 10px; height: 10px; border-radius: 999px; background: #2e6b45"></span>
        </span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="3" y="7" width="18" height="12" rx="2"></rect><path d="M7 7V5a5 5 0 0 1 10 0v2"></path></svg>
        Apple Pay / Google Pay
        <span style="margin-left: auto; font-size: 11.5px; color: #9aa899">schnellste Option</span>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <span style="width: 20px; height: 20px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d"></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
        Kredit- oder Bankomatkarte
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14px; text-align: left; cursor: pointer">
        <span style="width: 20px; height: 20px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d"></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
        Vor Ort bezahlen (Bar &amp; Karte)
      </button>
    </div>

  </div>

  <div style="flex: none; padding: 12px 16px 18px; border-top: 1px solid #1f2c21; background: #0e150f">
    <button style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 999px; background: #2e6b45; color: #f6f4ea; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      Jetzt bestellen · € 10,30
    </button>
    <div style="margin-top: 8px; text-align: center; font-size: 11.5px; color: #8b9a8b">Abholung heute, 15–18 Uhr · Mit der Bestellung akzeptierst du die AGB.</div>
  </div>

</div>
</body>
</html>
