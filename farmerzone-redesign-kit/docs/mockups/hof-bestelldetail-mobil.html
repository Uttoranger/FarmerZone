<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestelldetail – Hofbereich Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px">
    <button aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #f1eee3; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600">Bestellung #1047</div>
    <div style="flex-grow: 1"></div>
    <button aria-label="Anna Leitner anrufen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #f1eee3; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2Z"></path></svg>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0; min-height: 0">

    <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid #8a5330; background: rgba(224, 122, 74, 0.08)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e59a6f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <div style="flex: 1">
        <div style="font-size: 14px; font-weight: 600; color: #e59a6f">Zum Packen</div>
        <div style="margin-top: 1px; font-size: 12.5px; color: #c9d2c6">Abholung heute, 15–18 Uhr · Abholcode M-1047</div>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 13px 14px; border-bottom: 1px solid #1f2c21">
        <div style="font-size: 15px; font-weight: 600">Artikel packen</div>
        <div style="font-size: 12.5px; color: #9aa899">1 von 2 erledigt</div>
      </div>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Gepackt" style="width: 26px; height: 26px; flex: none; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600; color: #a9b4a8">10 × Freilandeier</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #7c8a7b">Kühlregal · € 4,50</span>
        </span>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span aria-label="Als gepackt markieren" style="width: 26px; height: 26px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d"></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 14.5px; font-weight: 600">1 × Bauernbrot, 1 kg</span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899">Brotregal · € 5,80</span>
        </span>
      </button>
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; border-top: 1px solid #1f2c21">
        <div style="font-size: 13.5px; color: #9aa899">Gesamt</div>
        <div style="flex-grow: 1"></div>
        <div style="font-size: 15px; font-weight: 600">€ 10,30</div>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #24352a; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">AL</div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <div style="font-size: 14.5px; font-weight: 600">Anna Leitner</div>
          <span style="padding: 2px 8px; border-radius: 999px; background: #1c281e; font-size: 10.5px; color: #c9d2c6">6. Bestellung</span>
        </div>
        <div style="margin-top: 2px; font-size: 12.5px; color: #9aa899">[Telefonnummer der Kundin]</div>
      </div>
      <button aria-label="Nachricht senden" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #f1eee3; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5c0 4.1-4 7.5-9 7.5-1 0-2-.14-2.9-.4L3 21l1.6-4.3A7 7 0 0 1 3 11.5C3 7.4 7 4 12 4s9 3.4 9 7.5Z"></path></svg>
      </button>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 10px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9fd0af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
      <div style="flex: 1; font-size: 13.5px; color: #d8ddd2">Online bezahlt · Apple Pay</div>
      <span style="flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid #2f5a3d; background: rgba(46, 107, 69, 0.1); color: #9fd0af; font-size: 11.5px; font-weight: 600">Bezahlt</span>
    </div>

  </div>

  <div style="flex: none; padding: 12px 16px 18px; border-top: 1px solid #1f2c21; background: #0e150f">
    <button style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; border-radius: 999px; background: #2e6b45; color: #f6f4ea; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
      Als gepackt markieren
    </button>
    <div style="margin-top: 8px; text-align: center">
      <a href="#" style="font-size: 12.5px; text-decoration: none; color: #9aa899">Problem mit der Bestellung melden</a>
    </div>
  </div>

</div>
</body>
</html>
