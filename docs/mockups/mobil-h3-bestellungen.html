<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestellungen – Hofbereich Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body style="margin:0;background:#0b100c">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="flex: none; display: flex; align-items: flex-end; gap: 10px; padding: 16px 16px 0">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600">Bestellungen</h1>
    <div style="padding-bottom: 3px; font-size: 12.5px; color: #9aa899">32 diese Woche</div>
    <div style="flex-grow: 1"></div>
    <button aria-label="Suchen" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #f1eee3; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0; min-height: 0">

    <div style="flex: none; display: flex; gap: 3px; background: #0e150f; border: 1px solid #1f2c21; border-radius: 999px; padding: 3px; align-self: flex-start">
      <button style="padding: 7px 14px; border: none; border-radius: 999px; background: #223125; color: #f1eee3; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer">Alle</button>
      <button style="padding: 7px 14px; border: none; border-radius: 999px; background: none; color: #9aa899; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">Zum Packen</button>
      <button style="padding: 7px 14px; border: none; border-radius: 999px; background: none; color: #9aa899; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">Gepackt</button>
      <button style="padding: 7px 14px; border: none; border-radius: 999px; background: none; color: #9aa899; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">Abgeholt</button>
    </div>

    <div style="flex: none; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #8b9a8b; padding: 2px 2px 0">Heute, 15–18 Uhr</div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600">Anna Leitner</span>
            <span style="font-size: 12px; color: #9aa899">#1047</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">10 Eier · 1 Bauernbrot · € 10,30</span>
        </span>
        <span style="flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid #8a5330; background: rgba(224, 122, 74, 0.08); color: #e59a6f; font-size: 11.5px; font-weight: 600">Zum Packen</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600">Familie Wimmer</span>
            <span style="font-size: 12px; color: #9aa899">#1046</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gemüsekiste groß · 6 Eier · € 21,60</span>
        </span>
        <span style="flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid #8a5330; background: rgba(224, 122, 74, 0.08); color: #e59a6f; font-size: 11.5px; font-weight: 600">Zum Packen</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600">Josef Huber</span>
            <span style="font-size: 12px; color: #9aa899">#1045</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 Bauernbrot · € 11,60</span>
        </span>
        <span style="flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid #2f5a3d; background: rgba(46, 107, 69, 0.1); color: #9fd0af; font-size: 11.5px; font-weight: 600">Gepackt</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600">Maria Schuster</span>
            <span style="font-size: 12px; color: #9aa899">#1044</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #9aa899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gemüsekiste klein · Honig 500 g · € 21,90</span>
        </span>
        <span style="flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid #2f5a3d; background: rgba(46, 107, 69, 0.1); color: #9fd0af; font-size: 11.5px; font-weight: 600">Gepackt</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="flex: none; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #8b9a8b; padding: 2px 2px 0">Samstag, 9–12 Uhr</div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600; color: #a9b4a8">Sophie Auer</span>
            <span style="font-size: 12px; color: #7c8a7b">#1042</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #7c8a7b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Honig 500 g · 6 Eier · € 12,20</span>
        </span>
        <span style="flex: none; display: flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; border: 1px solid #35443a; color: #a9b4a8; font-size: 11.5px; font-weight: 600">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
          Abgeholt
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px">
            <span style="font-size: 14.5px; font-weight: 600; color: #a9b4a8">Peter Gruber</span>
            <span style="font-size: 12px; color: #7c8a7b">#1041</span>
          </span>
          <span style="display: block; margin-top: 2px; font-size: 12.5px; color: #7c8a7b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gemüsekiste klein · € 14,90</span>
        </span>
        <span style="flex: none; display: flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; border: 1px solid #35443a; color: #a9b4a8; font-size: 11.5px; font-weight: 600">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
          Abgeholt
        </span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Heute" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 10.5px">Heute</span>
    </button>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Bestellungen</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Neu erstellen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #e07a4a; color: #231208; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button aria-label="Produkte" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z"></path><path d="M3.3 8.3L12 13l8.7-4.7M12 13v9"></path></svg>
      <span style="font-size: 10.5px">Produkte</span>
    </button>
    <button aria-label="Mehr" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px">Mehr</span>
    </button>
  </div>

</div>
</body>
</html>
