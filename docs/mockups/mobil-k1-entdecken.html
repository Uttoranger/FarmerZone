      <input aria-label="Hof oder Produkt suchen" placeholder="Hof oder Produkt suchen …" style="width: 100%; height: 46px; box-sizing: border-box; border-radius: 999px; background: #131b14; border: 1px solid #26352a; color: #f1eee3; font-family: inherit; font-size: 14px; padding: 0 16px 0 40px; outline: none">
    </div>

    <div style="flex: none; height: 150px; border-radius: 16px; background: #16211a; border: 1px solid #223125; position: relative; overflow: hidden">
      <svg width="358" height="150" viewBox="0 0 358 150" fill="none" style="position: absolute; inset: 0">
        <path d="M-10 112 C 60 92, 120 128, 180 96 S 290 44, 370 58" stroke="#33473a" stroke-width="9" stroke-linecap="round"></path>

        <path d="M250 -10 C 236 50, 262 100, 244 160" stroke="#2b3d31" stroke-width="5" stroke-linecap="round"></path>

      Karte öffnen
      </button>
    </div>

    <div style="flex: none; display: flex; align-items: baseline; gap: 8px; padding: 2px 2px 0">
      <div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">Höfe in deiner Nähe</div>
      <div style="flex-grow: 1"></div>
      <a href="#" style="font-size: 12.5px; font-weight: 600; text-decoration: none">Alle →</a>
    </div>

    <button style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden; padding: 0; color: #f1eee3; font-family: inherit; text-align: left; cursor: pointer">
      <span style="display: block; height: 64px; background: linear-gradient(150deg, #2c5a3a, #16301f)"></span>
      <span style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
        <span style="width: 40px; height: 40px; flex: none; margin-top: -30px; border-radius: 999px; background: linear-gradient(150deg, #35684a, #16301f); border: 2px solid #131b14; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 600">HM</span>

        <span style="flex: none; display: flex; gap: 5px">

        <span style="width: 40px; height: 40px; flex: none; margin-top: -30px; border-radius: 999px; background: #24352a; border: 2px solid #131b14; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 600">B</span>

        <span style="flex: none; display: flex; gap: 5px">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"></circle><circle cx="17" cy="20" r="1.6"></circle><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg>
      </button>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.3-1.5L14.4 21l-2.4-1.5L9.6 21l-2.3-1.5L5 21V3Z"></path><path d="M9 8h6M9 12h6"></path></svg>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>
