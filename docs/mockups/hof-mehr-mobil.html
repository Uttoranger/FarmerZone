<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehr – Hofbereich Mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
a{color:#9fd0af}a:hover{color:#c2e3cc}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="flex: none; padding: 16px 16px 0">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600">Mehr</h1>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0; min-height: 0">

    <div style="flex: none; background: #18231a; border: 1px solid #223125; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 40px; height: 40px; flex: none; border-radius: 999px; background: #24352a; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">B</div>
        <div style="min-width: 0">
          <div style="font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #8b9a8b">Mein Hof</div>
          <div style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Beispielhof</div>
        </div>
      </div>
      <button style="width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #2f3f31; border-radius: 12px; background: none; color: #f1eee3; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Hofseite ansehen
      </button>
    </div>

    <div style="flex: none; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: #8b9a8b; padding: 2px 2px 0">Verkauf und Kunden</div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"></path><path d="M16 5a3.5 3.5 0 0 1 0 6.3M18.5 14.7c2 .8 3 2.4 3 4.3"></path></svg>
        <span style="flex: 1">Kunden</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 12l10 10 10-10L12 2H4a2 2 0 0 0-2 2v8Z"></path><circle cx="8" cy="8" r="1.6"></circle></svg>
        <span style="flex: 1">Verkäufe</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
        <span style="flex: 1">Auswertung</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 2px 0">
      <div style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #24352a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">JB</div>
      <div style="min-width: 0">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #8b9a8b">Angemeldet</div>
        <div style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Jakob Beispiel</div>
      </div>
    </div>

    <div style="flex: none; background: #131b14; border: 1px solid #223125; border-radius: 16px; overflow: hidden">
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"></path><circle cx="16" cy="6" r="2"></circle><circle cx="7" cy="12" r="2"></circle><circle cx="16" cy="18" r="2"></circle></svg>
        <span style="flex: 1">Einstellungen</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.1-2.5 3.6"></path><path d="M12 17h.01"></path></svg>
        <span style="flex: 1">Hilfe und Rückmeldung</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3Z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span style="flex: 1">Admin</span>
        <span style="flex: none; width: 19px; height: 19px; border-radius: 999px; background: #e07a4a; color: #231208; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">1</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#62705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <span style="flex: 1">Heller Modus</span>
        <span aria-label="Heller Modus aus" style="flex: none; width: 38px; height: 22px; border-radius: 999px; background: #2c3a2e; position: relative">
          <span style="position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 999px; background: #8b9a8b"></span>
        </span>
      </button>
      <button style="width: 100%; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: none; border: none; border-top: 1px solid #1f2c21; color: #f1eee3; font-family: inherit; font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cfd6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg>
        <span style="flex: 1">Abmelden</span>
      </button>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Heute" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 10.5px">Heute</span>
    </button>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 10.5px">Bestellungen</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Neu erstellen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #e07a4a; color: #231208; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button aria-label="Mein Hof" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10Z"></path><path d="M9 21v-8h6v8"></path></svg>
      <span style="font-size: 10.5px">Mein Hof</span>
    </button>
    <button aria-label="Mehr" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Mehr</span>
    </button>
  </div>

</div>
</body>
</html>
