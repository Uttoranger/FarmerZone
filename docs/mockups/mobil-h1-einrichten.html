<!doctype html>

<title>Hof mobil – Einrichten (Onboarding)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}

<body style="margin:0;background:#0b100c">
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">
  <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #1f2c21"><div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">Hof einrichten</div><div style="flex-grow: 1"></div></div>  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 96px"><div style="display: flex; align-items: baseline"><div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">Noch 4 Schritte</div><span style="flex-grow: 1"></span><span style="color: #9fd0af; font-weight: 600">2 von 6</span></div><div style="height: 7px; border-radius: 999px; background: #1c281e"><div style="width: 33%; height: 7px; border-radius: 999px; background: #2e6b45"></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid #223125; border-radius: 13px; "><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">Konto erstellt</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">Beispielhof</div></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid rgba(224,122,74,0.55); border-radius: 13px; "><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 2px solid #e07a4a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #e59a6f">2</span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">Hofseite einrichten</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">7 von 11 fertig</div><button style="height: 32px; padding: 0 18px; border-radius: 999px; border: 1px solid #2f3f31; background: none; color: #f1eee3; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">Weiter</button></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid #223125; border-radius: 13px; "><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; background: #2e6b45; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f6f4ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">Erste Produkte</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">2 angelegt</div></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid rgba(224,122,74,0.55); border-radius: 13px; "><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 2px solid #e07a4a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #e59a6f">4</span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">Online-Zahlung (Stripe)</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">ca. 10 Min. · IBAN und Ausweis bereitlegen</div><button style="height: 36px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(35,18,8,0.28); background: #e07a4a; color: #231208; font-weight: 600; font-family: inherit; font-size: 14px; cursor: pointer">Mit Stripe einrichten</button></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid #223125; border-radius: 13px; opacity: 0.6;"><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #8b9a8b">5</span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">SEPA-Mandat</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">für die Monatsabrechnung</div></div></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: #131b14; border: 1px solid #223125; border-radius: 13px; opacity: 0.6;"><span style="width: 24px; height: 24px; flex: none; border-radius: 999px; border: 2px solid #3a4a3d; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #8b9a8b">6</span><div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><div style="font-size: 14px; font-weight: 600">Freischaltung</div><div style="font-size: 12px; color: #9aa899; line-height: 1.5">wir melden uns per E-Mail</div></div></div></div>  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Heute" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Heute</span>
    </button>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 10.5px">Bestellungen</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Neu erstellen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #e07a4a; color: #231208; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button aria-label="Produkte" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z"></path><path d="M3.3 8.3L12 13l8.7-4.7M12 13v9"></path></svg>
      <span style="font-size: 10.5px">Produkte</span>
    </button>
    <button aria-label="Mehr" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px">Mehr</span>
    </button>
  </div>
</div>
</body>
</html>
