<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorschau-Modus Web – Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#070b08}
</style>
</head>
<body style="margin:0;background:#0B100C">
<div style="width: 1440px; height: 1080px; box-sizing: border-box; background: #070b08; color: #f1eee3; display: flex; flex-direction: column; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div style="flex: none; height: 64px; display: flex; align-items: center; padding: 0 28px; gap: 16px; border-bottom: 1px solid #16201a; position: relative">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <div style="font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 600">Vorschau</div>
      <div style="font-size: 13.5px; color: #9aa899">Beispielhof · so sehen Kunden deine Hofseite</div>
    </div>
    <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; background: #0e150f; border: 1px solid #1f2c21; border-radius: 999px; padding: 3px">
      <button style="padding: 6px 18px; border: none; border-radius: 999px; background: none; color: #9aa899; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Handy</button>
      <button style="padding: 6px 18px; border: none; border-radius: 999px; background: #223125; color: #f1eee3; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Web</button>
    </div>
    <div style="flex-grow: 1"></div>
    <button style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #f1eee3; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">
      In neuem Tab öffnen
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6M10 14L21 3"></path></svg>
    </button>
    <button aria-label="Vorschau schließen" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 1px solid #2f3f31; border-radius: 999px; background: none; color: #f1eee3; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 22px 0 0">
    <div style="width: 872px; border: 1px solid #2c3a2e; border-radius: 16px 16px 0 0; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); background: #0b100c">
      <div style="height: 42px; background: #10170f; border-bottom: 1px solid #1f2c21; display: flex; align-items: center; padding: 0 16px; gap: 14px">
        <div style="display: flex; gap: 7px">
          <span style="width: 11px; height: 11px; border-radius: 999px; background: #2c3a2e"></span>
          <span style="width: 11px; height: 11px; border-radius: 999px; background: #2c3a2e"></span>
          <span style="width: 11px; height: 11px; border-radius: 999px; background: #2c3a2e"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: center">
          <div style="display: flex; align-items: center; gap: 7px; padding: 6px 16px; border-radius: 999px; background: #0e150f; border: 1px solid #1f2c21; font-size: 12.5px; color: #9aa899">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9fd0af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            agrilo.at/beispielhof
          </div>
        </div>
        <div style="width: 39px"></div>
      </div>
      <div style="position: relative; width: 870px; height: 880px; overflow: hidden">
        <div style="width: 1440px; height: 1500px; transform: scale(0.604); transform-origin: top left">
          <div style="width:100%;height:100%;background:#10170f;display:flex;align-items:center;justify-content:center;color:#8b9a8b;font-size:28px">Eingebettet: Desktop (siehe eigenes Mockup)</div>
        </div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(to bottom, rgba(7, 11, 8, 0), rgba(7, 11, 8, 0.85))"></div>
      </div>
    </div>
    <div style="margin-top: 14px; font-size: 12.5px; color: #8b9a8b">Scrollt wie im Browser · Der Umschalter oben wechselt zwischen Handy und Web</div>
  </div>

</div>
</body>
</html>
