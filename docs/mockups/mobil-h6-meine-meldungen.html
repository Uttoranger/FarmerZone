<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hof mobil – Meine Meldungen</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#0b100c}
</style>
</head>
<body style="margin:0;background:#0b100c">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b100c; color: #f1eee3; display: flex; flex-direction: column; position: relative; overflow: hidden; font-family: 'Instrument Sans', system-ui, sans-serif">
  <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #1f2c21"><button aria-label="Zurück" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #18231a; color: #f1eee3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button><div style="font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600">Meine Meldungen</div><div style="flex-grow: 1"></div></div>  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 96px"><button style="width: 100%; height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #2e6b45; color: #f6f4ea; font-weight: 600; font-family: inherit; font-size: 14px; cursor: pointer">+ Neue Meldung</button><div style="padding: 14px 16px; background: #131b14; border: 1px solid #2e6b45; border-radius: 14px"><div style="display: flex; align-items: center; gap: 10px"><span style="padding: 2px 9px; border-radius: 999px; background: rgba(224,122,74,0.14); border: 1px solid rgba(224,122,74,0.45); color: #e59a6f; font-size: 11.5px; font-weight: 600; white-space: nowrap">Fehler</span><span style="flex: 1; font-size: 13.5px; font-weight: 600">Foto lädt nicht hoch</span><span style="font-size: 12.5px; color: #8b9a8b">heute</span><span style="padding: 2px 9px; border-radius: 999px; background: rgba(46,107,69,0.18); border: 1px solid rgba(46,107,69,0.5); color: #9fd0af; font-size: 11.5px; font-weight: 600; white-space: nowrap">In Arbeit</span></div><div style="margin-top: 10px; padding: 11px 13px; background: #10170f; border-left: 3px solid #2e6b45; border-radius: 8px; font-size: 13.5px; color: #cfd6c6; line-height: 1.5"><b style="color: #f1eee3">Antwort:</b> Liegt am iPhone-Bildformat – Umwandlung kommt.</div></div><div style="padding: 14px 16px; background: #131b14; border: 1px solid #223125; border-radius: 14px"><div style="display: flex; align-items: center; gap: 10px"><span style="padding: 2px 9px; border-radius: 999px; background: rgba(224,122,74,0.14); border: 1px solid rgba(224,122,74,0.45); color: #e59a6f; font-size: 11.5px; font-weight: 600; white-space: nowrap">Fehler</span><span style="flex: 1; font-size: 13.5px; font-weight: 600">Umlaute in der Packliste</span><span style="font-size: 12.5px; color: #8b9a8b">26. Sept</span><span style="padding: 2px 9px; border-radius: 999px; background: rgba(46,107,69,0.18); border: 1px solid rgba(46,107,69,0.5); color: #9fd0af; font-size: 11.5px; font-weight: 600; white-space: nowrap">Behoben</span></div></div><div style="padding: 14px 16px; background: #131b14; border: 1px solid #223125; border-radius: 14px"><div style="display: flex; align-items: center; gap: 10px"><span style="padding: 2px 9px; border-radius: 999px; background: #18231a; border: 1px solid #2c3a2e; color: #cfd6c6; font-size: 11.5px; font-weight: 600; white-space: nowrap">Frage</span><span style="flex: 1; font-size: 13.5px; font-weight: 600">LFBIS-Nummer ändern?</span><span style="font-size: 12.5px; color: #8b9a8b">12. Sept</span><span style="padding: 2px 9px; border-radius: 999px; background: rgba(46,107,69,0.18); border: 1px solid rgba(46,107,69,0.5); color: #9fd0af; font-size: 11.5px; font-weight: 600; white-space: nowrap">Beantwortet</span></div></div></div>  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #0e150f; border-top: 1px solid #1f2c21; display: flex; align-items: stretch; padding: 8px 8px 12px; box-sizing: border-box">
    <button aria-label="Heute" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"></path></svg>
      <span style="font-size: 10.5px; font-weight: 600">Heute</span>
    </button>
    <button aria-label="Bestellungen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 10.5px">Bestellungen</span>
    </button>
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center">
      <button aria-label="Neu erstellen" style="width: 54px; height: 54px; border-radius: 999px; border: none; background: #e07a4a; color: #231208; display: flex; align-items: center; justify-content: center; transform: translateY(-20px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45); cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button aria-label="Produkte" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #8b9a8b; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z"></path><path d="M3.3 8.3L12 13l8.7-4.7M12 13v9"></path></svg>
      <span style="font-size: 10.5px">Produkte</span>
    </button>
    <button aria-label="Mehr" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: #f1eee3; font-family: inherit; cursor: pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      <span style="font-size: 10.5px">Mehr</span>
    </button>
  </div>
</div>
</body>
</html>
