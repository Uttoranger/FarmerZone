name: CI

on:
  push:
    branches: [main]
  # Auch gestapelte PRs bekommen die CI (Register G3, Nr. 127): Der Sammel-PR und die
  # Nummern des Nachtlaufs zielen auf integration/**, docs/** und nacht/** statt auf
  # main; Fehler im Zusammenspiel sollen vor dem Sammel-PR auffallen. Das Muster
  # gilt für den Basis-Branch des PRs. Wird die Basis eines PRs nachträglich
  # umgestellt, startet die CI nicht neu: danach einmal pushen. Nie
  # pull_request_target (CLAUDE.md §2, tests/workflows-wache.test.ts).
  pull_request:
    branches: ['main', 'integration/**', 'docs/**', 'nacht/**']

# Ein neuer Push bricht den laufenden Lauf desselben PRs ab; auf main hat jeder Lauf
# seine eigene Gruppe (den Commit) und wird nie abgebrochen.
concurrency:
  group: "ci-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Dauer der letzten 25 abgeschlossenen Läufe (bis 21.10.2026): kürzester 2,6,
    # Median 4,6, längster 6,1 Minuten. 20 ist rund das Dreifache des längsten —
    # ein langsamer Runner oder ein kalter Cache bricht nicht ab, ein hängender
    # Lauf kostet aber nicht die Vorgabe von 360 Minuten.
    timeout-minutes: 20
    env:
      # Dummy-Werte, keine echten Secrets: `next build` importiert Module, die
      # Stripe/Prisma/Auth beim Laden instanziieren und dafür gesetzte
      # ENV-Variablen erwarten. Es wird keine echte Verbindung aufgebaut —
      # DB-Zugriffe passieren erst zur Laufzeit (alle Seiten sind dynamisch).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci-dummy
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci-dummy
      BETTER_AUTH_SECRET: ci-dummy-secret-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      STRIPE_CONNECT_CLIENT_ID: ca_ci_dummy
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version kommt aus dem "packageManager"-Feld der package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        # 19 vorbestehende Lint-Fehler in UI-Komponenten (Stand Sprint 15) —
        # bewusst nicht-blockierend, das Aufräumen ist ein eigener Folge-Sprint.
        # Sobald `pnpm lint` lokal grün ist: continue-on-error entfernen!
        continue-on-error: true
        run: pnpm lint

      - name: Illustrationen prüfen
        # Eigener Schritt statt Teil des Lints: Der Lint ist nicht blockierend,
        # diese Prüfung schon (WebP, 1024 × 1024, höchstens 80 KB, einfarbiger
        # Rand — scripts/illustrationen.ts, Register I1).
        run: pnpm illustrationen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Regelvorschlag 74, gebaut in Nr. 75: Die Hofseite liest die Illustrationen
      # der Unterkategorien vom Dateisystem (product-image.ts, assetExists). Fehlen
      # sie in ihrer Trace-Datei, fehlen sie in Produktion still — dann wird die CI rot.
      - name: Unterkategorie-Bilder im Paket der Hofseite
        env:
          TRACE: .next/server/app/(public)/[farmSlug]/page.js.nft.json
        run: |
          node -e "
            const { files } = JSON.parse(require('node:fs').readFileSync(process.env.TRACE, 'utf8'))
            const treffer = files.filter((f) => /public\/categories\/(?!sw\/)[^/]+\/[^/]+\.webp$/.test(f))
            if (treffer.length === 0) {
              console.log('FEHLER ' + process.env.TRACE + ': keine Illustration einer Unterkategorie (public/categories/<kategorie>/<name>.webp)')
              process.exit(1)
            }
            console.log(treffer.length + ' Illustrationen von Unterkategorien in ' + process.env.TRACE)
          "

  # Zweite Testschicht: Server-Handler gegen ein echtes Postgres
  # (docs/ai/TESTING_GUIDELINES.md, Abschnitt 1). Eigener Job, damit ein
  # fehlender Datenbankdienst nie die schnelle Suite mit umbringt und beide
  # parallel laufen.
  #
  # KEINE SECRETS. Die Datenbank entsteht leer im Container dieses Laufs und
  # verschwindet mit ihm; Passwort und Name stehen offen da, weil sie nichts
  # schützen. Die Sicherheitssperre
  # (tests/integration/setup/sicherheitssperre.ts) lässt ohnehin nur lokale
  # Hosts durch.
  integration:
    runs-on: ubuntu-latest
    # Letzte 25 Läufe (bis 21.10.2026): kürzester 2,9, Median 3,6, längster 4,5
    # Minuten; 15 ist das Dreifache des längsten (Begründung beim Job ci).
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farmerzone_test
        ports:
          - 5432:5432
        # Ohne Health-Check startet der erste Migrationslauf, bevor Postgres
        # Verbindungen annimmt.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Der Dienst ist auf den Runner gemappt, deshalb localhost und nicht der
      # Dienstname postgres.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/farmerzone_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # Vitest direkt statt `pnpm test:integration`: Das Script lädt .env.test
      # über dotenv-cli, und die Datei gibt es hier bewusst nicht — die Adresse
      # steht oben im Job. Alles Übrige (Stripe- und Resend-Platzhalter) setzt
      # vitest.integration.config.ts selbst.
      - name: Integrationstests
        run: pnpm exec vitest run --config vitest.integration.config.ts
